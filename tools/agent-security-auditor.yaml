name: agent-security-auditor
description: Scans agent code for API key leakage, unsanitized prompt injection vectors,
  and missing guardrails.
input_schema:
  type: object
  properties:
    agent_dir:
      type: string
      description: Directory containing agent source code and configuration files.
    strict_audit:
      type: boolean
      description: Whether to enforce strict zero-tolerance security rules.
  required:
  - agent_dir
